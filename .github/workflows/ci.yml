name: ARIA CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Backend: build + test + coverage ──────────────────────────────────────
  backend:
    name: Backend (Java 17 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & run tests with coverage
        run: mvn clean verify -Dspring.profiles.active=test
        env:
          ANTHROPIC_API_KEY: test-key-not-real

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

      - name: Coverage summary
        run: |
          echo "=== Test Summary ==="
          grep -r "tests run:" backend/target/surefire-reports/*.txt 2>/dev/null | tail -5 || true

  # ── Docker: build image ────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: aria-emergency:${{ github.sha }},aria-emergency:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Frontend + Android: validation ────────────────────────────────────────
  frontend:
    name: Frontend + Android validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate index.html
        run: |
          FILE=backend/src/main/resources/static/index.html
          SIZE=$(wc -c < "$FILE")
          echo "index.html size: $SIZE bytes"
          [ "$SIZE" -gt 50000 ] || (echo "Too small!" && exit 1)

          - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('backend/src/main/resources/static/manifest.json')); print('manifest.json OK')"

      - name: Validate service worker
        run: test -f backend/src/main/resources/static/sw.js && echo "sw.js OK"

      - name: Validate schema.sql
        run: grep -c "CREATE TABLE" schema.sql | xargs -I{} echo "{} tables in schema.sql"

      - name: Validate Android Kotlin files compile (syntax check)
        run: |
          KT_COUNT=$(find android -name "*.kt" | wc -l)
          echo "Kotlin files: $KT_COUNT"
          [ "$KT_COUNT" -gt 10 ] || (echo "Too few Kotlin files!" && exit 1)

      - name: Validate AndroidManifest
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('android/src/main/AndroidManifest.xml')
          root = tree.getroot()
          perms = root.findall('{http://schemas.android.com/apk/res/android}uses-permission')
          print(f'AndroidManifest OK: {len(perms)} permissions declared')
          "

      - name: Check Postman collection
        run: |
          python3 -c "
          import json
          c = json.load(open('ARIA-API.postman_collection.json'))
          total = sum(len(f.get('item',[])) for f in c['item'])
          print(f'Postman: {len(c[\"item\"])} folders, {total} requests')
          assert total >= 50, f'Expected 50+ requests, got {total}'
          "

      - name: Architecture docs present
        run: test -f docs/ARCHITECTURE.md && wc -l docs/ARCHITECTURE.md
