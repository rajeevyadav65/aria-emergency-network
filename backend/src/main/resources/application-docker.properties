# ── Docker profile ─────────────────────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=docker  (set in docker-compose.yml)

server.port=8080

# ── Persistent H2 (file-based) ─────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:/app/data/ariadb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:aria-docker-secret-key-change-in-production-32c}
app.jwt.expiration-ms=86400000

# ── Emergency ─────────────────────────────────────────────────────────────────
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65

# ── Rate Limiting ─────────────────────────────────────────────────────────────
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=30

# ── Anthropic AI ──────────────────────────────────────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-20250514

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.emergency=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
