# ── Production / Docker profile ───────────────────────────────────────────────
# Activated by: -Dspring.profiles.active=prod  OR  SPRING_PROFILES_ACTIVE=prod

server.port=8080

# ── Database (switch to PostgreSQL for production) ────────────────────────────
# H2 works fine for single-instance deployment; swap for Postgres below:
#
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:ariadb}
# spring.datasource.username=${DB_USER:aria}
# spring.datasource.password=${DB_PASSWORD:changeme}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=jdbc:h2:file:/app/data/ariadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:aria-emergency-network-super-secret-key-32chars}
app.jwt.expiration-ms=86400000

# ── Emergency ─────────────────────────────────────────────────────────────────
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65

# ── Anthropic AI ──────────────────────────────────────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-20250514

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.emergency=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ── AI Detection ──────────────────────────────────────────────────────────────
app.ai.detection.enabled=true
app.ai.detection.confidence-threshold=0.75

# ── Medical Services ──────────────────────────────────────────────────────────
app.medical.search-radius-km=10

# ── Disaster Alerts ───────────────────────────────────────────────────────────
app.disaster.fetch-enabled=true

# ── OpenAPI (disabled in prod) ───────────────────────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── CORS (restrict to your actual frontend domain in prod) ────────────────────
app.cors.allowed-origins=https://aria-emergency.example.com
