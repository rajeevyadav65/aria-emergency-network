# ── Server Configuration ──────────────────────────────────────────────────────
server.port=8080
# 🟢 ALLOWS EXTERNAL CONNECTIONS (Ensure phone & laptop are on same Wi-Fi)
server.address=0.0.0.0

# ── MySQL Database (Replaces H2) ──────────────────────────────────────────────
# 🟢 Note: Ensure MySQL is running on your laptop
spring.datasource.url=jdbc:mysql://localhost:3306/smart_sahayata?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
# 🟢 'update' ensures new columns like 'reported_by_device_id' are created automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Jackson (Date Formatting) ─────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT (Security) ────────────────────────────────────────────────────────────
# 🟢 Must be at least 32 characters
app.jwt.secret=emergency-network-super-secret-key-32chars-minimum
app.jwt.expiration-ms=86400000

# ── Emergency Settings ────────────────────────────────────────────────────────
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65

# ── Anthropic AI (Claude) ─────────────────────────────────────────────────────
# 🟢 If you don't have a key, leave it empty like this: anthropic.api.key=
anthropic.api.key=
anthropic.api.model=claude-3-sonnet-20240229

# ── Logging (For Debugging 500 Errors) ────────────────────────────────────────
logging.level.com.emergency=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── System Features ──────────────────────────────────────────────────────────
app.ai.detection.enabled=true
app.ai.detection.confidence-threshold=0.75
app.cors.allowed-origins=*

# ── Circular References ──────────────────────────────────────────────────────
# 🟢 Enabled as per your project requirement to prevent Startup Failure
spring.main.allow-circular-references=true