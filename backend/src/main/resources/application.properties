# ── Server Configuration ──────────────────────────────────────────────────────
# Use the PORT Railway (or other platforms) provides; default to 8080 for local
server.port=${PORT:8080}
server.address=0.0.0.0

# spring.datasource.url=... (ise comment out kar dein)

#
## Database URL
# You can provide either SPRING_DATASOURCE_URL (preferred) or DATABASE_URL (Railway/Heroku style)
# Example DATABASE_URL for Postgres: postgres://user:pass@host:5432/dbname
# Example SPRING_DATASOURCE_URL: jdbc:postgresql://host:5432/dbname

# If neither SPRING_DATASOURCE_URL nor DATABASE_URL are set, the default Aiven MySQL URL (legacy) will be used.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://aria-mysql-db-aria-database.g.aivencloud.com:22130/defaultdb?ssl-mode=REQUIRED}}

# Credentials (Environment Variables use karna behtar hai)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## If you are using Postgres, set the dialect via SPRING_DATASOURCE_URL or set spring.jpa.properties.hibernate.dialect
## e.g. spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT (Security) ─────────────────────────────────────────────────────────
# 🟢 Secret key ko bhi variable bana diya hai
app.jwt.secret=${JWT_SECRET:emergency-network-super-secret-key-32chars-minimum}
app.jwt.expiration-ms=86400000

# ── Emergency Settings ────────────────────────────────────────────────────────
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65

# ── Anthropic AI (Claude) ─────────────────────────────────────────────────────
anthropic.api.key=${AI_API_KEY:}
anthropic.api.model=claude-3-sonnet-20240229

# ── Logging (For Debugging 500 Errors) ────────────────────────────────────────
logging.level.com.emergency=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG

# ── OpenAPI / Swagger ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── System Features ─────────────────────────────────────────────────────────
app.ai.detection.enabled=true
app.ai.detection.confidence-threshold=0.75
app.cors.allowed-origins=*

spring.main.allow-circular-references=true

