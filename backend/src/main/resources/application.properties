# ── Server Configuration ──────────────────────────────────────────────────────
server.port=8080
server.address=0.0.0.0

# ── MySQL Database (Connected to Aiven Cloud - SECURED) ───────────────────────
# 🟢 GitHub par asli URL aur Password kabhi nahi daalte. Use Environment Variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Jackson (Date Formatting) ─────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT (Security) ────────────────────────────────────────────────────────────
# 🟢 Secret key ko bhi variable bana diya hai
app.jwt.secret=${JWT_SECRET:emergency-network-super-secret-key-32chars-minimum}
app.jwt.expiration-ms=86400000

# ── Emergency Settings ────────────────────────────────────────────────────────
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65

# ── Anthropic AI (Claude) ─────────────────────────────────────────────────────
anthropic.api.key=${AI_API_KEY:}
anthropic.api.model=claude-3-sonnet-20240229

# ── Logging (For Debugging 500 Errors) ────────────────────────────────────────
logging.level.com.emergency=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── System Features ──────────────────────────────────────────────────────────
app.ai.detection.enabled=true
app.ai.detection.confidence-threshold=0.75
app.cors.allowed-origins=*

spring.main.allow-circular-references=true