    .lp{width:8px;height:8px;border-radius:50%;background:var(--red);animation:lp 2s ease infinite}

    .aw{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
    .ac{background:var(--s);border:1px solid var(--b);border-radius:var(--r3);padding:36px;width:390px;max-width:95vw}
    .alo{font-family:var(--fh);font-size:26px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}

    .af{display:flex;flex-direction:column;gap:13px}

    .dh{background:var(--s2);border:1px solid var(--b);border-radius:var(--r2);padding:10px 13px;font-size:12px;color:var(--t2);text-align:center;line-height:1.7}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const API='https://cubical-tint-chaos.ngrok-free.dev';
const http={
  post:(p,b,t)=>fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:JSON.stringify(b)}).then(r=>r.json()),
  get:(p,t)=>fetch(API+p,{headers:{...(t?{Authorization:'Bearer '+t}:{})}}).then(r=>r.json()),
  patch:(p,t)=>fetch(API+p,{method:'PATCH',headers:{...(t?{Authorization:'Bearer '+t}:{})}}).then(r=>r.json()),
  del:(p,t)=>fetch(API+p,{method:'DELETE',headers:{...(t?{Authorization:'Bearer '+t}:{})}}),
};
const fmt=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmtDT=d=>new Date(d).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const genId=()=>'dev-'+Math.random().toString(36).slice(2,10);
let _toast=null;
function Toasts(){
  const[ts,setTs]=useState([]);
  _toast=useCallback((m,type='info')=>{const id=Date.now();setTs(t=>[...t,{id,m,type}]);setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),4500);},[]);
  return(<div className="tw">{ts.map(t=><div key={t.id} className={`toast ${t.type==='emergency'?'em':t.type==='success'?'ok':'info'}`}><span style={{fontSize:15}}>{t.type==='emergency'?'🚨':t.type==='success'?'✅':'ℹ️'}</span><span>{t.m}</span></div>)}</div>);
}
const toast=(m,t)=>_toast&&_toast(m,t);

function usePagination(items, pageSize=10){
  const[page,setPage]=useState(0);
  const total=Math.ceil(items.length/pageSize);
  const paged=items.slice(page*pageSize,(page+1)*pageSize);
  const reset=()=>setPage(0);
  return{paged,page,setPage,total,reset,hasPrev:page>0,hasNext:page<total-1};
}

function Pagination({page,total,onPrev,onNext,size}){
  if(total<=1)return null;
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderTop:'1px solid var(--b)',marginTop:8}}>
      <button className="btn bgh bsm" onClick={onPrev} disabled={page===0}>← Prev</button>
      <span style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--t2)'}}>Page {page+1} of {total} · {size} items</span>
      <button className="btn bgh bsm" onClick={onNext} disabled={page===total-1}>Next →</button>
    </div>
  );
}

function Auth({ onAuth }) {
  const [tab, setTab] = useState('login');
  const [f, setF] = useState({ name: '', contact: '', password: '', role: 'USER', language: 'en', otp: '', newPassword: '' });
  const [loading, setL] = useState(false);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const did = useRef(localStorage.getItem('deviceId') || genId());

  useEffect(() => { localStorage.setItem('deviceId', did.current); }, []);
  const set = k => e => setF(f => ({ ...f, [k]: e.target.value }));

  const go = async () => {
    setL(true); setErr(''); setMsg('');
    try {
      let res;
      if (tab === 'login') {
        res = await http.post('/api/auth/login', { contact: f.contact, password: f.password });
        if (res.token) { onAuth({...res, language: f.language}); return; }
      }
      else if (tab === 'register') {
        res = await http.post('/api/auth/register', { name: f.name, contact: f.contact, password: f.password, deviceId: did.current, preferredLanguage: f.language, role: f.role });
        if (res.token) { onAuth({...res, language: f.language}); return; }
      }
      else if (tab === 'forgot') {
        res = await http.post('/api/auth/forgot-password', { contact: f.contact });
        if (res.message) { setMsg('OTP sent to console! Check IntelliJ.'); setTab('reset'); setL(false); return; }
      }
      else if (tab === 'reset') {
        res = await http.post('/api/auth/reset-password', { contact: f.contact, otp: f.otp, newPassword: f.newPassword });
        if (res.message) { setMsg('Password reset done! Login now.'); setTab('login'); setL(false); return; }
      }
      if (res && (res.error || res.message)) setErr(res.error || res.message);
    } catch (e) { setErr('Connection Error. Backend started?'); }
    setL(false);
  };

  return (
    <div className="aw"><div className="ac">
      <div className="alo"><div className="lp" />ARIA</div>
      <div className="asub">AI Emergency Response Ecosystem</div>

      {['login', 'register', 'forgot'].includes(tab) && (
        <div className="ata">
          <div className={`atb${tab === 'login' ? ' on' : ''}`} onClick={() => { setTab('login'); setErr(''); setMsg(''); }}>Login</div>
          <div className={`atb${tab === 'register' ? ' on' : ''}`} onClick={() => { setTab('register'); setErr(''); setMsg(''); }}>Register</div>
        </div>
      )}

      <div className="af">
        {err && <div className="aerr">{err}</div>}
        {msg && <div style={{background: 'var(--gbg)', color: 'var(--green)', padding: '10px', borderRadius: '5px', fontSize: '12px'}}>{msg}</div>}

        {tab === 'register' && (
          <>
            <div className="fl"><label className="lbl">FULL NAME</label><input className="inp" value={f.name} onChange={set('name')} /></div>
            <div className="fl"><label className="lbl">EMAIL OR PHONE</label><input className="inp" placeholder="email@ext.com or 9876543210" value={f.contact} onChange={set('contact')} /></div>
            <div className="fl"><label className="lbl">PASSWORD</label><input className="inp" type="password" value={f.password} onChange={set('password')} /></div>

            <div className="fr">
              <div className="fl">
                <label className="lbl">REGISTER AS</label>
                <select className="inp sel" value={f.role} onChange={set('role')}>
                  <option value="USER">Patient / User</option>
                  <option value="DOCTOR">Doctor</option>
                  <option value="POLICE">Police</option>
                  <option value="AMBULANCE">Ambulance</option>
                </select>
              </div>
              <div className="fl">
                <label className="lbl">LANGUAGE</label>
                <select className="inp sel" value={f.language} onChange={set('language')}>
                  <option value="en">English</option><option value="hi">Hindi</option>
                  <option value="bn">Bengali</option>
                </select>
              </div>
            </div>
          </>
        )}

        {tab === 'login' && (
          <>
            <div className="fl"><label className="lbl">EMAIL OR PHONE</label><input className="inp" value={f.contact} onChange={set('contact')} /></div>
            <div className="fl"><label className="lbl">PASSWORD</label><input className="inp" type="password" value={f.password} onChange={set('password')} /></div>
            <div style={{textAlign: 'right', fontSize: '11px', color: 'var(--blue)', cursor: 'pointer'}} onClick={() => setTab('forgot')}>Forgot Password?</div>
          </>
        )}

        {tab === 'forgot' && (
          <div className="fl"><label className="lbl">ENTER EMAIL OR PHONE</label><input className="inp" placeholder="To receive OTP" value={f.contact} onChange={set('contact')} /></div>
        )}
        {tab === 'reset' && (
          <>
            <div className="fl"><label className="lbl">ENTER OTP</label><input className="inp" placeholder="6-digit OTP" value={f.otp} onChange={set('otp')} /></div>
            <div className="fl"><label className="lbl">NEW PASSWORD</label><input className="inp" type="password" value={f.newPassword} onChange={set('newPassword')} /></div>
          </>
        )}

        <button className="btn bp bfw" onClick={go} disabled={loading} style={{ marginTop: 4 }}>
          {loading ? <div className="spin" /> : (tab === 'forgot' ? 'Send OTP' : tab === 'reset' ? 'Reset Password' : 'Continue')}
        </button>
      </div>
    </div></div>
  );
}

function Dashboard({auth,wsAlerts,emergencies,stats}){
  const chartRef=useRef();const chartInst=useRef();
  useEffect(()=>{
    if(!chartRef.current)return;
    chartInst.current?.destroy();
    const h=emergencies.slice(0,7).map((e,i)=>({label:fmtDT(e.createdAt||new Date()),val:e.riskLevel==='HIGH'?3:e.riskLevel==='MEDIUM'?2:1}));
    chartInst.current=new Chart(chartRef.current,{
      type:'bar',
      data:{labels:h.map(x=>x.label),datasets:[{label:'Risk Level',data:h.map(x=>x.val),backgroundColor:h.map(x=>x.val===3?'rgba(240,71,71,.7)':x.val===2?'rgba(245,158,11,.7)':'rgba(34,197,94,.7)'),borderRadius:4,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>['','LOW','MEDIUM','HIGH'][c.raw]||c.raw}}},scales:{x:{ticks:{color:'#555d78',font:{size:9}},grid:{color:'#1f2230'}},y:{ticks:{color:'#555d78',stepSize:1,callback:v=>['','LOW','MED','HIGH'][v]||''},grid:{color:'#1f2230'},min:0,max:3}}}
    });
    return()=>chartInst.current?.destroy();
  },[emergencies]);
  const high=emergencies.filter(e=>e.riskLevel==='HIGH'&&e.status==='ACTIVE').length;
  const res=emergencies.filter(e=>e.status==='RESOLVED').length;
  const rate=stats?stats.resolutionRatePercent:0;
  return(
    <div className="page">
      <div><div className="stitle">Overview{auth.name?', '+auth.name.split(' ')[0]:''} 👋</div><div className="ssub">Emergency network live status</div></div>
      <DutyToggle auth={auth||{}} token={auth?.token}/>
      <div className="g4">
        <div className="sc r"><div className="sn" style={{color:'var(--red)'}}>{high}</div><div className="sl">High Risk Active</div></div>
        <div className="sc a"><div className="sn" style={{color:'var(--amber)'}}>{emergencies.filter(e=>e.riskLevel==='MEDIUM').length}</div><div className="sl">Medium Risk</div></div>
        <div className="sc g"><div className="sn" style={{color:'var(--green)'}}>{res}</div><div className="sl">Resolved</div></div>
        <div className="sc bl"><div className="sn" style={{color:'var(--blue)'}}>{wsAlerts.length}</div><div className="sl">WS Alerts</div></div>
      </div>
      {stats&&(stats.totalDoctors>0||stats.totalPolice>0||stats.totalAmbulances>0)&&(
        <div className="g3">
          <div className="sc bl"><div className="sn" style={{color:'var(--blue)'}}>{stats.totalDoctors||0}</div><div className="sl">🩺 Doctors</div></div>
          <div className="sc r"><div className="sn" style={{color:'var(--purple)'}}>{stats.totalPolice||0}</div><div className="sl">👮 Police</div></div>
          <div className="sc r"><div className="sn" style={{color:'var(--red)'}}>{stats.totalAmbulances||0}</div><div className="sl">🚑 Ambulances</div></div>
        </div>
      )}
      {stats&&(
        <div className="g3">
          <div className="card">
            <div className="ch"><span className="ct">Resolution Rate</span></div>
            <div style={{fontFamily:'var(--fh)',fontSize:32,fontWeight:800,color:'var(--green)'}}>{rate}%</div>
            <div className="pbar" style={{marginTop:10}}><div className="pbar-fill" style={{width:rate+'%',background:'var(--green)'}}/></div>
          </div>
          <div className="card">
            <div className="ch"><span className="ct">False Alarm Rate</span></div>
            <div style={{fontFamily:'var(--fh)',fontSize:32,fontWeight:800,color:'var(--amber)'}}>{stats.falseAlarmRatePercent}%</div>
            <div className="pbar" style={{marginTop:10}}><div className="pbar-fill" style={{width:stats.falseAlarmRatePercent+'%',background:'var(--amber)'}}/></div>
          </div>
          <div className="card">
            <div className="ch"><span className="ct">Notifications (24h)</span></div>
            <div style={{fontFamily:'var(--fh)',fontSize:32,fontWeight:800,color:'var(--blue)'}}>{stats.notificationsLast24h}</div>
            <div style={{fontSize:11,color:'var(--t2)',marginTop:8,fontFamily:'var(--fm)'}}>{stats.deliveredNotifications} total delivered</div>
          </div>
        </div>
      )}
      <div className="card">
        <div className="ch"><span className="ct">Risk Level Timeline</span><span className="tag">{emergencies.length} incidents</span></div>
        <div className="chart-wrap"><canvas ref={chartRef}/></div>
      </div>
      <div className="g2">
        <div className="card">
          <div className="ch"><span className="ct">System Status</span></div>
          {[['AI Analysis Engine','ONLINE','var(--green)'],['WebSocket Server','ONLINE','var(--green)'],['Location Service','ACTIVE','var(--green)'],['Rate Limiter','ENABLED','var(--blue)'],['H2 Database','CONNECTED','var(--green)']].map(([l,s,c])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12,padding:'6px 0',borderBottom:'1px solid var(--b)'}}>
              <span style={{color:'var(--t2)'}}>{l}</span><span style={{fontFamily:'var(--fm)',fontSize:10,color:c}}>{s}</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="ch"><span className="ct">Recent Incidents</span></div>
          {emergencies.length===0?<div className="ph"><div className="phi">📋</div>No emergencies yet</div>:(
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {emergencies.slice(0,4).map(e=>(
                <div key={e.id} className="ei">
                  <div className={`eic ${e.riskLevel}`}>{e.riskLevel==='HIGH'?'🚨':e.riskLevel==='MEDIUM'?'⚠️':'ℹ️'}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="etl">#{e.id} — {e.message||'No description'}</div>
                    <div className="em"><span className={`rp ${e.riskLevel}`}>{e.riskLevel}</span><span className={`rp ${e.status}`}>{e.status}</span></div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SOSPage({auth,token,onNew}){
  const[f,setF]=useState({message:'',latitude:'',longitude:'',fallDetected:false,movement:'UNKNOWN',userResponse:'NO_RESPONSE'});
  const[loading,setL]=useState(false);const[result,setR]=useState(null);const[locating,setLoc]=useState(false);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.type==='checkbox'?e.target.checked:e.target.value}));
  const gps=()=>{setLoc(true);navigator.geolocation?.getCurrentPosition(p=>{setF(f=>({...f,latitude:p.coords.latitude.toFixed(6),longitude:p.coords.longitude.toFixed(6)}));setLoc(false);toast('Location obtained ✓','success');},()=>{toast('Location unavailable','info');setLoc(false);});};
  const submit=async()=>{
    setL(true);setR(null);
    try{const res=await http.post('/api/emergency/report',{...f,latitude:parseFloat(f.latitude)||0,longitude:parseFloat(f.longitude)||0,deviceId:auth.deviceId},token);setR(res);onNew&&onNew(res);toast(`Emergency reported — ${res.riskLevel} risk`,res.riskLevel==='HIGH'?'emergency':'success');}
    catch(e){toast('Failed to report — check server','emergency');}
    setL(false);
  };
  const rc={HIGH:'var(--red)',MEDIUM:'var(--amber)',LOW:'var(--green)',FALSE_ALARM:'var(--t2)'};
  return(
    <div className="page">
      <div><div className="stitle">SOS Emergency Report</div><div className="ssub">Trigger an immediate SOS or submit a detailed report</div></div>
      <div style={{position:'relative'}}><div className="sr"/><div className="sr"/><button className="sos" onClick={submit} disabled={loading}>{loading?'⏳  PROCESSING…':'🆘  TRIGGER  SOS'}</button></div>
      {result&&(
        <div className="card" style={{borderColor:(rc[result.riskLevel]||'var(--b)')+'44'}}>
          <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
            <div style={{fontSize:28,flexShrink:0}}>{result.status==='FALSE_ALARM'?'✅':result.riskLevel==='HIGH'?'🚨':'⚠️'}</div>
            <div style={{flex:1}}><div style={{fontFamily:'var(--fh)',fontSize:14,fontWeight:700,marginBottom:8}}>{result.message}</div>
              <div style={{display:'flex',gap:7,flexWrap:'wrap'}}><span className={`rp ${result.riskLevel}`}>{result.riskLevel}</span><span className="tag">#{result.emergencyId}</span><span className="tag">👥 {result.nearbyUsersAlerted} alerted</span><span className="tag">{result.aiAction}</span></div>
            </div>
          </div>
        </div>
      )}
      <div className="card">
        <div className="ch"><span className="ct">Detailed Report</span></div>
        <div style={{display:'flex',flexDirection:'column',gap:13}}>
          <div className="fl"><label className="lbl">SITUATION DESCRIPTION</label><textarea className="inp ta" placeholder="Describe what happened…" value={f.message} onChange={set('message')}/></div>
          <div className="fr"><div className="fl"><label className="lbl">LATITUDE</label><input className="inp" placeholder="e.g. 27.1767" value={f.latitude} onChange={set('latitude')}/></div><div className="fl"><label className="lbl">LONGITUDE</label><input className="inp" placeholder="e.g. 78.0081" value={f.longitude} onChange={set('longitude')}/></div></div>
          <button className="btn bgh bsm" onClick={gps} disabled={locating} style={{alignSelf:'flex-start'}}>{locating?<><div className="spin"/><span>Locating…</span></>:<>📍 Use GPS Location</>}</button>
          <div className="fr">
            <div className="fl"><label className="lbl">MOVEMENT</label><select className="inp sel" value={f.movement} onChange={set('movement')}>{['UNKNOWN','STATIONARY','WALKING','RUNNING'].map(v=><option key={v}>{v}</option>)}</select></div>
            <div className="fl"><label className="lbl">USER RESPONSE</label><select className="inp sel" value={f.userResponse} onChange={set('userResponse')}>{['NO_RESPONSE','NEED_HELP','ARE_YOU_OK'].map(v=><option key={v}>{v}</option>)}</select></div>
          </div>
          <label style={{display:'flex',alignItems:'center',gap:9,cursor:'pointer',fontSize:13}}><input type="checkbox" checked={f.fallDetected} onChange={set('fallDetected')} style={{width:15,height:15,accentColor:'var(--red)'}}/>Fall detected by sensor / accelerometer</label>
          <button className="btn bp bsm" onClick={submit} disabled={loading} style={{alignSelf:'flex-start'}}>{loading?<><div className="spin"/>Submitting…</>:<>📤 Submit Report</>}</button>
        </div>
      </div>
    </div>
  );
}

function ChatPage({auth,token}){
  const[msgs,setMsgs]=useState([{role:'ai',content:"Hello! I'm ARIA — your AI Emergency Assistant. I help with first-aid guidance, safety tips, and emergency reporting.\n\nUse 🎤 for voice input. How can I help?",time:new Date()}]);
  const[inp,setInp]=useState('');const[loading,setL]=useState(false);const[rec,setRec]=useState(false);const[speaking,setSpeaking]=useState(false);const[emAlert,setEm]=useState(null);
  const botRef=useRef();const recRef=useRef();const sid=auth.deviceId;
  useEffect(()=>{botRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,loading]);
  const send=async(text)=>{
    const m=(text||inp).trim();if(!m)return;setInp('');
    setMsgs(ms=>[...ms,{role:'u',content:m,time:new Date()}]);setL(true);
    try{const res=await http.post('/api/chat/message',{sessionId:sid,message:m},token);const reply=res.reply||'Could not process that.';setMsgs(ms=>[...ms,{role:'ai',content:reply,time:new Date(),em:res.isEmergency}]);if(res.isEmergency){setEm(reply);toast('⚠️ ARIA detected a potential emergency!','emergency');}doSpeak(reply);}
    catch(e){setMsgs(ms=>[...ms,{role:'ai',content:'Connection error. Check server on port 8080.',time:new Date()}]);}
    setL(false);
  };
  const doSpeak=text=>{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(0,280));u.rate=1.05;u.pitch=1.05;u.volume=0.85;const vs=window.speechSynthesis.getVoices();const pref=vs.find(v=>v.name.includes('Samantha')||v.name.includes('UK English Female')||v.name.includes('Female'));if(pref)u.voice=pref;u.onstart=()=>setSpeaking(true);u.onend=()=>setSpeaking(false);window.speechSynthesis.speak(u);};
  const toggleVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice not supported','info');return;}if(rec){recRef.current?.stop();setRec(false);return;}const r=new SR();recRef.current=r;r.lang='en-IN';r.continuous=false;r.interimResults=false;r.onresult=e=>send(e.results[0][0].transcript);r.onend=()=>setRec(false);r.onerror=()=>{setRec(false);};r.start();setRec(true);toast('🎤 Listening…','info');};
  const clear=async()=>{await http.del('/api/chat/clear?sessionId='+sid,token);setMsgs([{role:'ai',content:'Chat cleared. How can I help?',time:new Date()}]);setEm(null);};
  const quick=['I need help','I fell down','Chest pain','Nearest hospital?','First aid for burn','I feel dizzy'];
  return(
    <div className="cw">
      <div className="chd">
        <div className="cai"><div className="av">A</div><div><div className="an">ARIA — Emergency AI Assistant</div><div className="ast"><div className="dot dg"/>{speaking?<><div className="vw"><div className="vb"/><div className="vb"/><div className="vb"/><div className="vb"/><div className="vb"/></div><span>Speaking…</span></>:'Online · Powered by Claude'}</div></div></div>
        <div style={{display:'flex',gap:7}}>{speaking&&<button className="btn bgh bsm" onClick={()=>{window.speechSynthesis?.cancel();setSpeaking(false);}}>🔇 Stop</button>}<button className="btn bgh bsm" onClick={clear}>🗑 Clear</button></div>
      </div>
      <div className="qb">{quick.map(q=><div key={q} className="qbt" onClick={()=>send(q)}>{q}</div>)}</div>
      {emAlert&&(<div className="eal"><span style={{fontSize:16}}>🚨</span><div style={{flex:1}}><div style={{fontWeight:500,marginBottom:2}}>Emergency detected</div><div style={{color:'var(--t2)',fontSize:11}}>ARIA flagged a potential emergency. Use SOS for immediate help.</div></div><button className="btn bxs" style={{background:'var(--red)',color:'#fff',border:'none'}} onClick={()=>setEm(null)}>✕</button></div>)}
      <div className="msgs">{msgs.map((m,i)=><div key={i} className={`msg ${m.role}`}><div className={`mav ${m.role}`}>{m.role==='ai'?'A':'U'}</div><div><div className={`mb${m.em?' em':''}`} style={{whiteSpace:'pre-wrap'}}>{m.content}</div><div className="mt">{fmt(m.time)}</div></div></div>)}{loading&&<div className="msg ai"><div className="mav ai">A</div><div className="ty"><div className="td"/><div className="td"/><div className="td"/></div></div>}<div ref={botRef}/></div>
      <div className="cir">
        <button className={`ib${rec?' rec':''}`} onClick={toggleVoice}>{rec?'⏹':'🎤'}</button>
        <textarea className="ci" placeholder="Type a message or use voice… (Enter to send)" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} rows={1}/>
        <button className="sb" onClick={()=>send()} disabled={!inp.trim()||loading}>➤</button>
      </div>
    </div>
  );
}


function PaginatedEmList({ems,resolve}){
  const{paged,page,setPage,total,hasPrev,hasNext}=usePagination(ems,15);
  const icons={HIGH:'🚨',MEDIUM:'⚠️',LOW:'ℹ️',FALSE_ALARM:'✅',RESOLVED:'✅'};
  return(
    <>
      <div style={{display:'flex',flexDirection:'column',gap:7}}>
        {paged.map(e=><div key={e.id} className="ei">
          <div className={`eic ${e.riskLevel}`}>{icons[e.riskLevel]||'❓'}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="etl">#{e.id} — {e.message||'No description'}</div>
            <div className="em"><span className={`rp ${e.riskLevel}`}>{e.riskLevel}</span><span className={`rp ${e.status}`}>{e.status}</span>{e.latitude&&<span className="emo">📍 {parseFloat(e.latitude).toFixed(3)}, {parseFloat(e.longitude).toFixed(3)}</span>}{e.aiAction&&<span className="emo">{e.aiAction}</span>}</div>
          </div>
          {e.status==='ACTIVE'&&<button className="btn bg bxs" onClick={()=>resolve(e.id)}>Resolve</button>}
        </div>)}
      </div>
      <Pagination page={page} total={total} onPrev={()=>setPage(p=>p-1)} onNext={()=>setPage(p=>p+1)} size={ems.length}/>
    </>
  );
}

function AlertsPage({wsAlerts,token}){
  const[ems,setEms]=useState([]);const[loading,setL]=useState(false);
  const load=async()=>{setL(true);try{const d=await http.get('/api/emergency/all',token);if(Array.isArray(d))setEms([...d].reverse());}catch(e){}setL(false);};
  useEffect(()=>{load();},[]);
  const resolve=async id=>{try{await http.patch('/api/emergency/'+id+'/resolve',token);setEms(es=>es.map(e=>e.id===id?{...e,status:'RESOLVED'}:e));toast('Resolved ✓','success');}catch(e){toast('Failed','info');}};
  const icons={HIGH:'🚨',MEDIUM:'⚠️',LOW:'ℹ️',FALSE_ALARM:'✅',RESOLVED:'✅'};
  return(
    <div className="page">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><div className="stitle">Alert Feed</div><div className="ssub">Emergencies and live WebSocket alerts</div></div><button className="btn bgh bsm" onClick={load}>↺ Refresh</button></div>
      {wsAlerts.length>0&&(<div className="card" style={{borderColor:'var(--rbr)'}}><div className="ch"><span className="ct">🔴 Live WebSocket Alerts</span><span className="tag">{wsAlerts.length}</span></div><div style={{display:'flex',flexDirection:'column',gap:7}}>{wsAlerts.slice().reverse().slice(0,8).map((a,i)=><div key={i} className="ei"><div className={`eic ${a.riskLevel}`}>{icons[a.riskLevel]||'⚡'}</div><div style={{flex:1,minWidth:0}}><div className="etl">{a.message}</div><div className="em"><span className={`rp ${a.riskLevel}`}>{a.riskLevel}</span>{a.distanceMeters&&<span className="emo">📍 {Math.round(a.distanceMeters)}m</span>}{a.sentAt&&<span className="emo">{fmt(a.sentAt)}</span>}</div></div></div>)}</div></div>)}
      <div className="card"><div className="ch"><span className="ct">All Emergencies</span><span className="tag">{ems.length}</span></div>
        {loading?<div style={{display:'flex',justifyContent:'center',padding:28}}><div className="spin"/></div>

function MapPage({auth,token,emergencies}){
  const[trail,setTrail]=useState([]);
  const mapRef=useRef();const mapInst=useRef();const[loc,setLoc]=useState(null);const[upd,setUpd]=useState(false);
  useEffect(()=>{
    navigator.geolocation?.getCurrentPosition(p=>setLoc({lat:p.coords.latitude,lon:p.coords.longitude}));
    if(token){
      http.get('/api/users/me/history',token)
        .then(d=>{if(Array.isArray(d))setTrail(d);})
        .catch(()=>{});
    }
  },[]);
  useEffect(()=>{
    if(!mapRef.current||mapInst.current)return;
    const map=L.map(mapRef.current,{center:[27.1767,78.0081],zoom:13,zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
    mapInst.current=map;
    return()=>{map.remove();mapInst.current=null;};
  },[]);
  useEffect(()=>{
    const map=mapInst.current;if(!map)return;
    map.eachLayer(l=>{if(l instanceof L.Marker||l instanceof L.Circle)map.removeLayer(l);});
    if(loc){
      const userIcon=L.divIcon({html:'<div style="width:14px;height:14px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>',iconSize:[14,14],iconAnchor:[7,7]});
      L.marker([loc.lat,loc.lon],{icon:userIcon}).addTo(map).bindPopup('<b style="color:#111">You are here</b>');
      L.circle([loc.lat,loc.lon],{radius:500,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:.08,weight:1}).addTo(map);
    }
    if(trail.length>=2){
      const pts=trail.map(h=>[h.latitude,h.longitude]);
      L.polyline(pts,{color:'#3b82f6',weight:2,opacity:.6,dashArray:'4 4'}).addTo(map);
      const trailIcon=L.divIcon({html:'<div style="width:8px;height:8px;border-radius:50%;background:#3b82f6;border:2px solid #fff"></div>',iconSize:[8,8],iconAnchor:[4,4]});
      pts.forEach(p=>L.marker(p,{icon:trailIcon}).addTo(map));
    }
    emergencies.filter(e=>e.latitude&&e.longitude&&e.status==='ACTIVE').forEach(e=>{
      const col=e.riskLevel==='HIGH'?'#f04747':e.riskLevel==='MEDIUM'?'#f59e0b':'#22c55e';
      const icon=L.divIcon({html:`<div style="width:28px;height:28px;border-radius:50%;background:${col};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.4)">${e.riskLevel==='HIGH'?'🚨':'⚠️'}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
      L.marker([e.latitude,e.longitude],{icon}).addTo(map).bindPopup(`<b style="color:#111">#${e.id}</b><br/><span style="color:#333">${e.message||'Emergency'}</span><br/><span style="color:${col};font-weight:600">${e.riskLevel}</span>`);
    });
  },[loc,emergencies,trail]);
  const push=async()=>{if(!loc)return;setUpd(true);try{await http.post('/api/location/update',{latitude:loc.lat,longitude:loc.lon,deviceId:auth.deviceId},token);toast('Location pushed ✓','success');}catch(e){}setUpd(false);};
  return(
    <div className="page">
      <div><div className="stitle">Live Map</div><div className="ssub">Your GPS position and active emergency markers (Leaflet + OpenStreetMap)</div></div>
      <div ref={mapRef} style={{height:360,borderRadius:'var(--r)',border:'1px solid var(--b)',overflow:'hidden'}}/>
      <div className="card"><div className="ch"><span className="ct">Map Controls</span></div>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn bb bsm" onClick={push} disabled={upd}>{upd?<><div className="spin"/>Updating…</>:<>📡 Push Location</>}</button>
          <button className="btn bgh bsm" onClick={()=>navigator.geolocation?.getCurrentPosition(p=>{setLoc({lat:p.coords.latitude,lon:p.coords.longitude});toast('GPS refreshed','success');})} >🔄 Refresh GPS</button>
          <span style={{fontSize:11,color:'var(--t2)',fontFamily:'var(--fm)'}}>{loc?`${loc.lat.toFixed(5)}° N, ${loc.lon.toFixed(5)}° E`:'No GPS fix'}</span>
          <span className="tag" style={{marginLeft:'auto'}}>{emergencies.filter(e=>e.status==='ACTIVE').length} active pins</span>
        </div>
      </div>
    </div>
  );
}

function DutyToggle({auth,token}){
  const isPro=['DOCTOR','POLICE','AMBULANCE'].includes(auth.role);
  const[onDuty,setOnDuty]=useState(false);const[loading,setL]=useState(false);
  if(!isPro)return null;
  const toggle=async()=>{
    setL(true);
    try{
      await fetch(API+'/api/dispatch/duty',{
        method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
        body:JSON.stringify({onDuty:!onDuty,isAvailable:!onDuty})
      });
      setOnDuty(d=>!d);
      toast((!onDuty?'You are now ON DUTY':'You are now OFF DUTY'),'success');
    }catch(e){}setL(false);
  };
  return(
    <div style={{background:onDuty?'var(--gbg)':'var(--s2)',border:`1px solid ${onDuty?'var(--gbr)':'var(--b)'}`,borderRadius:'var(--r)',padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:14}}>
      <div>
        <div style={{fontFamily:'var(--fh)',fontWeight:700,fontSize:14}}>{auth.role} Duty Status</div>
        <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>{onDuty?'You are receiving dispatch requests':'Toggle on to receive emergency dispatch'}</div>
      </div>
      <button className={`btn bsm ${onDuty?'bg':'bs'}`} onClick={toggle} disabled={loading}>
        {loading?<div className="spin"/>:onDuty?'● ON DUTY':'○ OFF DUTY'}
      </button>
    </div>
  );
}

  const onAuth=d=>{

    toast('Welcome'+(d.name?' '+d.name:'')+'! 👋','success');

  }

  const pages={dashboard:<Dashboard auth={auth||{}} wsAlerts={wsAlerts} emergencies={emergencies} stats={stats}/>,sos:<SOSPage auth={auth||{}} token={auth?.token} onNew={addNew}/>,chat:<ChatPage auth={auth||{}} token={auth?.token}/>,alerts:<AlertsPage wsAlerts={wsAlerts} token={auth?.token}/>,map:<MapPage auth={auth||{}} token={auth?.token} emergencies={emergencies}/>,notifications:<NotificationsPage auth={auth||{}} token={auth?.token}/>,search:<SearchPage token={auth?.token}/>,analytics:<AnalyticsPage/>,disasters:<DisasterPage wsAlerts={wsAlerts}/>,services:<NearbyServicesPage/>,consult:<ConsultationPage auth={auth||{}} token={auth?.token}/>,admin:<AdminPage token={auth?.token}/>,settings:<SettingsPage auth={auth||{}} token={auth?.token} onUpdate={d=>setAuth(a=>({...a,...d}))}/>,api:<ApiPage/>};

          <div className="app">
            <Toasts/>
            <div className="topbar">
              <div className="logo"><div className="lp"/>ARIA Emergency Network</div>
              <div className="tr">
                <div className="pill"><div className={`dot ${wsConn?'dg':'dgr'}`}/>{wsConn?'Live':'Offline'}</div>
                {wsAlerts.length>0&&<div className="pill" style={{borderColor:'var(--rbr)',color:'var(--red)'}}>🔔 {wsAlerts.length}</div>}
                <div className="pill" style={{background: 'var(--blue)', color: '#fff', border: 'none'}}>{auth.role||'GUEST'}</div>
                <button className="btn bgh bsm" onClick={logout}>Sign out</button>
              </div>
            </div>
            <div className="body">
              <div className="sidebar">
                <div className="nav"><div className="nl">Navigation</div>{nav.map(n=><div key={n.id} className={`ni${page===n.id?' on':''}`} onClick={()=>setPage(n.id)}><span className="ic">{n.ic}</span><span>{n.label}</span>{n.badge&&n.badge>0&&<span className="nb">{n.badge}</span>}</div>)}</div>
                <div className="sf"><div className="si">{(auth.deviceId||'').slice(0,14)}…<br/><span style={{color:wsConn?'var(--green)':'var(--t3)'}}>{wsConn?'● WS Connected':'○ WS Offline'}</span></div></div>
              </div>
              <div className="main">{pages[page]||null}</div>
            </div>
          </div>
  );
}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(r=>console.log('[SW] Registered:',r.scope))
      .catch(e=>console.warn('[SW] Failed:',e));
  });
}
</script>
</body>
</html>
