# Test profile — uses separate in-memory DB, no data seeder conflicts
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-jwt-secret-key-minimum-32-characters-long
app.jwt.expiration-ms=86400000
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65
anthropic.api.key=test-key-not-real

# Rate limiting — disabled in tests so we don't hit 429
app.rate-limit.enabled=false
app.rate-limit.requests-per-minute=1000

# Actuator
management.endpoints.web.exposure.include=health,info

logging.level.com.emergency=WARN
logging.level.org.springframework.security=WARN

# ── Rate limiting ─────────────────────────────────────────────────────────────
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100

# ── Swagger (disabled in tests) ───────────────────────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── AI Detection ──────────────────────────────────────────────────────────────
app.ai.detection.enabled=false
app.ai.detection.confidence-threshold=0.75

# ── Medical ───────────────────────────────────────────────────────────────────
app.medical.search-radius-km=10

# ── Disaster ──────────────────────────────────────────────────────────────────
app.disaster.fetch-enabled=false

# ── AI Detection (test mode) ─────────────────────────────────────────────────
app.ai.detection.enabled=true
app.ai.detection.confidence-threshold=0.75

# ── Medical Services (test) ───────────────────────────────────────────────────
app.medical.search-radius-km=10

# ── Disaster Alerts (test — disable external fetch) ──────────────────────────
app.disaster.fetch-enabled=false
