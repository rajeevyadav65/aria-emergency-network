version: '3.9'

services:

  # ── Backend (Spring Boot) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aria-backend
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-your-api-key-here}
      - APP_JWT_SECRET=${JWT_SECRET:-aria-emergency-network-super-secret-key-32chars}
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - aria-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Optional: Nginx frontend proxy (for production) ────────────────────────
  # Uncomment to serve frontend via Nginx on port 80
  # nginx:
  #   image: nginx:alpine
  #   container_name: aria-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - backend

volumes:
  aria-data:
