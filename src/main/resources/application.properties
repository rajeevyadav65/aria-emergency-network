# ── Server Configuration ──────────────────────────────────────────────────────
server.port=8082
server.address=0.0.0.0


# ── JWT (Security) ────────────────────────────────────────────────────────────
# 🟢 Secret key ko bhi variable bana diya hai
app.jwt.secret=${JWT_SECRET:emergency-network-super-secret-key-32chars-minimum}
app.jwt.expiration-ms=86400000

# ── Emergency Settings ────────────────────────────────────────────────────────
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65

# ── Anthropic AI (Claude) ─────────────────────────────────────────────────────
anthropic.api.key=${AI_API_KEY:}
anthropic.api.model=claude-3-sonnet-20240229

# ── Logging (For Debugging 500 Errors) ────────────────────────────────────────
logging.level.com.emergency=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── System Features ──────────────────────────────────────────────────────────
app.ai.detection.enabled=true
app.ai.detection.confidence-threshold=0.75
app.cors.allowed-origins=*

spring.main.allow-circular-references=true


# ── H2 Database Configuration ──────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 🟢 HIBERNATE DD-AUTO (Tables automatic banane ke liye zaroori hai)
spring.jpa.hibernate.ddl-auto=update

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
