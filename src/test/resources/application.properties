# ── TEST DATABASE (Completely replaces MySQL for tests) ──
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── REQUIRED TEST PROPERTIES ──
app.jwt.secret=test-jwt-secret-key-minimum-32-characters-long
app.jwt.expiration-ms=86400000
app.emergency.nearby-radius-meters=500
app.emergency.min-confidence-score=0.65
anthropic.api.key=test-key-not-real

# ── DISABLE EXTERNAL CALLS & LIMITS FOR TESTS ──
app.rate-limit.enabled=false
app.rate-limit.requests-per-minute=1000
app.ai.detection.enabled=false
app.disaster.fetch-enabled=false
app.medical.search-radius-km=10
spring.main.allow-circular-references=true

# ── LOGGING ──
logging.level.com.emergency=WARN
logging.level.org.springframework.security=WARN