# ARIA Emergency Network — nginx reverse proxy
# Handles: gzip, security headers, rate limiting, WebSocket upgrade

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=report_limit:10m  rate=5r/m;

server {
    listen 80;
    server_name _;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml text/xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── Security Headers ─────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                    always;
    add_header X-Frame-Options           "SAMEORIGIN"                 always;
    add_header X-XSS-Protection          "1; mode=block"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:;" always;

    # ── Auth endpoints — strict rate limit (10 req/min per IP) ───────────
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Emergency report — strict rate limit (5 req/min per IP) ─────────
    location = /api/emergency/report {
        limit_req zone=report_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── All other API endpoints — general rate limit ──────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket — long timeout, no rate limit ───────────────────────────
    location /ws {
        proxy_pass          http://backend:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── Analytics and Swagger (no rate limit — read-only) ─────────────────
    location ~ ^/(api/analytics|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ── Actuator — health only, block other endpoints ─────────────────────
    location /actuator/health {
        proxy_pass http://backend:8080;
    }
    location /actuator {
        return 403;
    }

    # ── Static frontend ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Cache static assets
        proxy_cache_valid  200 1m;
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page 429 /errors/429.json;
    location = /errors/429.json {
        return 429 '{"error":"Too many requests","status":429,"message":"Rate limit exceeded. Please wait before retrying."}';
        add_header Content-Type application/json;
    }
}
